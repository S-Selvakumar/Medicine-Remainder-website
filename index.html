
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MediRemind</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💊</text></svg>">
<meta name="description" content="MediRemind - A simple, browser-based medicine reminder app created during my first semester of B.Tech as my first hackathon project. Preserved for GitHub Pages.">
<meta name="theme-color" content="#215ecb">
<style>
/* ===================================================================
   MediRemind — design tokens ported 1:1 from the original Replit
   prototype's index.css / tailwind.config.ts. Do not "improve" these.
=================================================================== */
:root {
  --button-outline: rgba(0,0,0,.10);
  --badge-outline: rgba(0,0,0,.05);
  --opaque-button-border-intensity: -8;
  --elevate-1: rgba(0,0,0,.03);
  --elevate-2: rgba(0,0,0,.08);

  --background: 0 0% 98%;
  --foreground: 220 15% 15%;
  --border: 220 10% 88%;
  --card: 0 0% 100%;
  --card-foreground: 220 15% 15%;
  --card-border: 220 8% 92%;
  --popover: 220 8% 94%;
  --popover-foreground: 220 15% 15%;
  --primary: 220 70% 45%;
  --primary-foreground: 220 70% 98%;
  --secondary: 220 10% 90%;
  --secondary-foreground: 220 15% 15%;
  --muted: 220 12% 92%;
  --muted-foreground: 220 10% 45%;
  --accent: 220 15% 90%;
  --accent-foreground: 220 15% 15%;
  --destructive: 15 80% 55%;
  --destructive-foreground: 15 80% 98%;
  --input: 220 15% 75%;
  --ring: 220 70% 45%;
  --chart-2: 145 60% 35%;

  --font-sans: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
  --radius-lg: .5625rem;
  --radius-md: .375rem;
  --radius-sm: .1875rem;

  --shadow-xs: 0px 1px 3px 0px hsl(220 15% 15% / 0.08);
  --shadow-sm: 0px 2px 4px -1px hsl(220 15% 15% / 0.06), 0px 1px 2px -1px hsl(220 15% 15% / 0.04);
  --shadow-md: 0px 6px 12px -2px hsl(220 15% 15% / 0.10), 0px 3px 6px -3px hsl(220 15% 15% / 0.08);
  --shadow-lg: 0px 10px 20px -4px hsl(220 15% 15% / 0.12), 0px 4px 8px -4px hsl(220 15% 15% / 0.08);
}

.dark {
  --button-outline: rgba(255,255,255,.10);
  --badge-outline: rgba(255,255,255,.05);
  --elevate-1: rgba(255,255,255,.04);
  --elevate-2: rgba(255,255,255,.09);

  --background: 220 15% 10%;
  --foreground: 220 10% 95%;
  --border: 220 12% 20%;
  --card: 220 12% 14%;
  --card-foreground: 220 10% 95%;
  --card-border: 220 12% 18%;
  --popover: 220 12% 16%;
  --popover-foreground: 220 10% 95%;
  --primary: 220 70% 55%;
  --primary-foreground: 220 15% 10%;
  --secondary: 220 12% 20%;
  --secondary-foreground: 220 10% 95%;
  --muted: 220 15% 18%;
  --muted-foreground: 220 8% 65%;
  --accent: 220 18% 20%;
  --accent-foreground: 220 10% 95%;
  --destructive: 15 75% 50%;
  --destructive-foreground: 220 10% 95%;
  --input: 220 12% 35%;
  --ring: 220 75% 65%;
  --chart-2: 145 60% 65%;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  font-family: var(--font-sans);
  background: hsl(var(--background));
  color: hsl(var(--foreground));
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3,p { margin: 0; }
button { font-family: inherit; cursor: pointer; }
input, textarea, select { font-family: inherit; }

.hidden { display: none !important; }

.max-w-4xl { max-width: 56rem; margin-left: auto; margin-right: auto; }
.px-4 { padding-left: 1rem; padding-right: 1rem; }
.py-4 { padding-top: 1rem; padding-bottom: 1rem; }
.py-6 { padding-top: 1.5rem; padding-bottom: 1.5rem; }

/* Header */
.app-header {
  position: sticky; top: 0; z-index: 40;
  background: hsl(var(--background));
  border-bottom: 1px solid hsl(var(--border));
}
.header-row {
  display: flex; align-items: center; justify-content: space-between;
}
.title-xl { font-size: 1.5rem; font-weight: 700; }
.subtitle { font-size: .875rem; color: hsl(var(--muted-foreground)); margin-top: 2px;}
.header-actions { display: flex; align-items: center; gap: .5rem; }

.page { min-height: 100vh; padding-bottom: calc(5rem + env(safe-area-inset-bottom, 0px)); }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: .5rem;
  border-radius: var(--radius-md);
  font-size: .875rem; font-weight: 500;
  padding: .5rem 1rem;
  height: 2.5rem;
  border: 1px solid transparent;
  background: hsl(var(--secondary));
  color: hsl(var(--secondary-foreground));
  transition: filter .1s ease;
  white-space: nowrap;
}
.btn:hover { position: relative; }
.btn:hover::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit;
  background: var(--elevate-1); pointer-events: none;
}
.btn { position: relative; }
.btn-primary { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); }
.btn-outline { background: transparent; border-color: hsl(var(--border)); color: hsl(var(--foreground)); }
.btn-ghost { background: transparent; }
.btn-destructive-outline { background: transparent; border-color: hsl(var(--destructive)); color: hsl(var(--destructive)); }
.btn-icon { width: 2.5rem; height: 2.5rem; padding: 0; }
.btn-icon.sm { width: 2.25rem; height: 2.25rem; }
.btn-sm { height: 2.25rem; padding: .375rem .75rem; font-size: .8125rem; }
.btn-lg { height: 2.75rem; padding: .625rem 1.5rem; font-size: 1rem; }
.btn-full { width: 100%; }
.btn-flex1 { flex: 1; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

/* Icon */
.icon { width: 1.25rem; height: 1.25rem; flex-shrink: 0; }
.icon-sm { width: 1rem; height: 1rem; }
.icon-xs { width: .75rem; height: .75rem; }

/* Card */
.card {
  background: hsl(var(--card));
  color: hsl(var(--card-foreground));
  border: 1px solid hsl(var(--card-border));
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-xs);
}
.card-p4 { padding: 1rem; }
.card-p6 { padding: 1.5rem; }
.border-l-4 { border-left-width: 4px; border-left-style: solid; }
.border-l-primary { border-left-color: hsl(var(--primary)); }
.border-l-destructive { border-left-color: hsl(var(--destructive)); }
.border-l-taken { border-left-color: hsl(var(--chart-2)); }

/* Badge */
.badge {
  display: inline-flex; align-items: center; gap: .25rem;
  border-radius: 9999px;
  font-size: .75rem; font-weight: 500;
  padding: .125rem .625rem;
  border: 1px solid var(--badge-outline);
  background: hsl(var(--secondary));
  color: hsl(var(--secondary-foreground));
  line-height: 1.4;
}
.badge-default { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); }
.badge-destructive { background: hsl(var(--destructive)); color: hsl(var(--destructive-foreground)); }
.badge-outline { background: transparent; border-color: hsl(var(--border)); color: hsl(var(--foreground)); }

/* Forms */
.field { margin-bottom: 1.25rem; }
.label { display: block; font-size: .875rem; font-weight: 500; margin-bottom: .375rem; }
.input, .textarea, .select {
  width: 100%;
  border: 1px solid hsl(var(--input));
  border-radius: var(--radius-md);
  background: hsl(var(--background));
  color: hsl(var(--foreground));
  padding: .5rem .75rem;
  font-size: .875rem;
  height: 2.5rem;
}
.textarea { height: auto; min-height: 4.5rem; resize: vertical; }
.help-text { font-size: .8125rem; color: hsl(var(--muted-foreground)); margin-top: .25rem; }
.error-text { font-size: .8125rem; color: hsl(var(--destructive)); margin-top: .25rem; }
.form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.form-actions { display: flex; gap: .75rem; margin-top: .5rem; }
.time-row { display: flex; gap: .5rem; }
.chips { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .75rem; }
.chip-remove { background: none; border: none; padding: 0; margin-left: .25rem; display: inline-flex; color: inherit; }

/* Switch */
.switch {
  position: relative; width: 2.5rem; height: 1.4rem;
  border-radius: 9999px; background: hsl(var(--secondary));
  border: 1px solid hsl(var(--border)); flex-shrink: 0;
  cursor: pointer; transition: background .15s ease;
}
.switch[data-on="true"] { background: hsl(var(--primary)); border-color: hsl(var(--primary)); }
.switch .knob {
  position: absolute; top: 1px; left: 1px;
  width: 1.1rem; height: 1.1rem; border-radius: 9999px;
  background: white; transition: transform .15s ease;
  box-shadow: var(--shadow-xs);
}
.switch[data-on="true"] .knob { transform: translateX(1.1rem); }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }

/* Bottom nav */
.bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  background: hsl(var(--card));
  border-top: 1px solid hsl(var(--border));
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.bottom-nav-inner {
  display: flex; align-items: center; justify-content: space-around;
  height: 4rem; max-width: 56rem; margin: 0 auto; padding: 0 1rem;
}
.nav-btn {
  display: flex; flex-direction: column; align-items: center; gap: .125rem;
  background: none; border: none; color: hsl(var(--muted-foreground));
  padding: .5rem .75rem; border-radius: var(--radius-md);
}
.nav-btn.active { color: hsl(var(--primary)); }
.nav-btn span { font-size: .6875rem; }

/* Dialog */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 60;
  display: flex; align-items: center; justify-content: center; padding: 1rem;
}
.dialog {
  background: hsl(var(--card)); color: hsl(var(--card-foreground));
  border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
  width: 100%; max-width: 42rem; max-height: 90vh; overflow-y: auto;
  padding: 1.5rem;
}
.dialog-title { font-size: 1.125rem; font-weight: 600; margin-bottom: 1.25rem; }

/* Empty state */
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4rem 1rem; text-align: center; }
.empty-icon-wrap { width: 12rem; height: 12rem; margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: center; }
.empty-icon { width: 6rem; height: 6rem; color: hsl(var(--primary)); opacity: .3; }
.empty-title { font-size: 1.5rem; font-weight: 600; margin-bottom: .5rem; }
.empty-desc { color: hsl(var(--muted-foreground)); max-width: 28rem; margin-bottom: 1.5rem; }

/* Toast */
.toast-container { position: fixed; top: 1rem; right: 1rem; z-index: 70; display: flex; flex-direction: column; gap: .5rem; max-width: 24rem; }
.toast-card { border-left: 4px solid hsl(var(--primary)); box-shadow: var(--shadow-lg); }

/* Schedule timeline */
.timeline-item { display: flex; gap: 1rem; align-items: flex-start; }
.timeline-marker { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; align-self: stretch; }
.timeline-line { width: 2px; flex: 1; min-height: 1.25rem; background: hsl(var(--border)); margin-top: .375rem; margin-bottom: .375rem; }
.timeline-content {
  flex: 1;
  padding: 0.875rem 1rem;
  border-radius: var(--radius-lg);
  border: 1px solid hsl(var(--card-border));
  background: hsl(var(--background) / 0.5);
  margin-bottom: 0.75rem;
  transition: background .15s ease, border-color .15s ease;
}
.opacity-60 { opacity: .6; }
/* Past-item states: keep the schedule readable even once several doses
   have passed — taken items get subtle dimming, missed items get a clean red card tint. */
.timeline-item.is-taken .timeline-marker .badge { opacity: .55; }
.timeline-item.is-taken .timeline-content { opacity: .8; background: hsl(var(--secondary) / 0.2); }
.timeline-item.is-missed .timeline-content {
  background: hsl(var(--destructive) / 0.08);
  border-color: hsl(var(--destructive) / 0.3);
}
.timeline-item.is-missed .timeline-marker .badge:not(.badge-default) {
  border-color: hsl(var(--destructive) / 0.4);
  color: hsl(var(--destructive));
}
.badge-missed {
  background: hsl(var(--destructive) / 0.15);
  color: hsl(var(--destructive));
  border-color: hsl(var(--destructive) / 0.3);
}
.timeline-missed-tag { color: hsl(var(--destructive)); }

/* Clock icon — tinted to match the app's blue theme instead of inheriting
   plain foreground/black text color. */
.icon-clock { color: hsl(var(--primary)); }

/* Utility flex/spacing used across components */
.flex { display: flex; }
.items-center { align-items: center; }
.items-start { align-items: flex-start; }
.justify-between { justify-content: space-between; }
.gap-1 { gap: .25rem; } .gap-2 { gap: .5rem; } .gap-3 { gap: .75rem; } .gap-4 { gap: 1rem; }
.flex-1 { flex: 1 1 0%; }
.flex-col { flex-direction: column; }
.flex-wrap { flex-wrap: wrap; }
.mt-1 {margin-top:.25rem;} .mt-2 {margin-top:.5rem;} .mt-3 {margin-top:.75rem;} .mt-4{margin-top:1rem;} .mb-1{margin-bottom:.25rem;} .mb-2{margin-bottom:.5rem;} .mb-3{margin-bottom:.75rem;} .mb-4{margin-bottom:1rem;} .mb-6{margin-bottom:1.5rem;}
.text-lg { font-size: 1.125rem; }
.text-xl { font-size: 1.25rem; }
.text-2xl { font-size: 1.5rem; }
.font-semibold { font-weight: 600; }
.font-bold { font-weight: 700; }
.font-medium { font-weight: 500; }
.text-sm { font-size: .875rem; }
.text-muted { color: hsl(var(--muted-foreground)); }
.text-primary { color: hsl(var(--primary)); }
.space-y-4 > * + * { margin-top: 1rem; }
.space-y-6 > * + * { margin-top: 1.5rem; }
.space-y-1 > * + * { margin-top: .25rem; }

@media (max-width: 640px) {
  .form-row-2 { grid-template-columns: 1fr; }
}
</style>
</head>

};

// ---------- Time formatting ----------
function formatTime12(time24) {
  if (!time24 || typeof time24 !== 'string' || !time24.includes(':')) return time24 || '';
  const [hStr, mStr] = time24.split(':');
  let h = Number(hStr);
  const m = Number(mStr);
  if (Number.isNaN(h) || Number.isNaN(m)) return time24;
  const period = h >= 12 ? 'PM' : 'AM';
  h = h % 12;
  if (h === 0) h = 12;
  return `${h}:${String(m).padStart(2, '0')} ${period}`;
}

// ---------- Notification Manager ----------
const NotificationManager = {
  permission: 'default',
  timers: new Map(),
  init() {
    if ('Notification' in window) this.permission = Notification.permission;
  },
  async requestPermission() {
    if ('Notification' in window) {
      const p = await Notification.requestPermission();
      this.permission = p;
      return p === 'granted';
    }
    return false;
  },
  scheduleReminder(reminder) {
    if (!reminder.enableNotifications) return;
    const scheduleNext = () => {
      const [h, m] = reminder.time.split(':').map(Number);
      const now = new Date();
      const scheduled = new Date();
      scheduled.setHours(h, m, 0, 0);
      if (scheduled < now) scheduled.setDate(scheduled.getDate() + 1);

      let rescheduled = false;
      const rescheduleOnce = () => { if (!rescheduled) { rescheduled = true; scheduleNext(); } };

      const reminderTime = new Date(scheduled.getTime() - 15 * 60000);
      const wait = reminderTime.getTime() - now.getTime();
      if (wait > 0) {
        const id = window.setTimeout(() => { this.showNotification(reminder); rescheduleOnce(); }, wait);
        this.timers.set(`${reminder.id}-${reminder.time}`, id);
      }
      if (reminder.enableVoiceReminder) {
        const voiceTime = new Date(scheduled.getTime() - 10 * 60000);
        const vwait = voiceTime.getTime() - now.getTime();
        if (vwait > 0) {
          const vid = window.setTimeout(() => { this.speakReminder(reminder); rescheduleOnce(); }, vwait);
          this.timers.set(`${reminder.id}-${reminder.time}-voice`, vid);
        }
      }
    };
    scheduleNext();
  },
  showNotification(reminder) {
    playBeep();
    if (this.permission === 'granted') {
      new Notification(`Time for ${reminder.medicineName}`, {
        body: `${reminder.dosage} - Scheduled for ${formatTime12(reminder.time)}`,
        tag: reminder.id,
        requireInteraction: true,
      });
    } else {
      showToast(`Time for ${reminder.medicineName}`, `${reminder.dosage} - Scheduled for ${formatTime12(reminder.time)}`);
    }
  },
  speakReminder(reminder) {
    if ('speechSynthesis' in window) {
      const u = new SpeechSynthesisUtterance(`It's time to take your medicine. ${reminder.medicineName}, ${reminder.dosage}`);
      u.rate = 0.9; u.pitch = 1; u.volume = 1;
      window.speechSynthesis.speak(u);
    }
  },
  cancelAll() {
    this.timers.forEach(id => clearTimeout(id));
    this.timers.clear();
  }
};

let sharedAudioCtx = null;
function unlockAudio() {
  if (!sharedAudioCtx) {
    try { sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { console.warn('AudioContext unavailable:', e); return; }
  }
  if (sharedAudioCtx.state === 'suspended') sharedAudioCtx.resume().catch(() => {});
}
document.addEventListener('click', unlockAudio, { once: false });

function playBeep() {
  try {
    if (!sharedAudioCtx) { unlockAudio(); }
    if (!sharedAudioCtx) return;
    if (sharedAudioCtx.state === 'suspended') sharedAudioCtx.resume().catch(() => {});
    const ctx = sharedAudioCtx;
    [880, 660].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const start = ctx.currentTime + i * 0.18;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.2, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.16);
      osc.connect(gain).connect(ctx.destination);
      osc.start(start);
      osc.stop(start + 0.18);
    });
  } catch (e) { console.warn('Could not play reminder sound:', e); }
}

// ---------- Email Manager ----------
const EmailManager = {
  async sendEmail({ to, subject, body }) {
    console.log('Email send request:', { to, subject, body });
    const normalizedBody = (body || '').replace(/\r\n|\n/g, '\r\n');
    const encTo = encodeURIComponent(to || '');
    const encSubject = encodeURIComponent(subject || '');
    const encBody = encodeURIComponent(normalizedBody);
    window.location.href = `mailto:${encTo}?subject=${encSubject}&body=${encBody}`;
    return true;
  }
};

function generateDailySummaryEmail() {
  const todayStr = new Date().toLocaleDateString(undefined, {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
  });
  
  const now = new Date();
  const isPast = (timeStr) => {
    const [h, m] = timeStr.split(':').map(Number);
    const scheduled = new Date(); scheduled.setHours(h, m, 0, 0);
    return now > scheduled;
  };

  const items = state.medicines.flatMap(med =>
    med.times.map(time => {
      const taken = !!med.takenTimes[time];
      const past = isPast(time);
      let statusStr = '';
      if (taken) statusStr = '✅ Taken';
      else if (past) statusStr = '⚠️ Missed (Not taken yet)';
      else statusStr = '⏳ Scheduled for later';

      return { med, time, statusStr, taken, past };
    })
  ).sort((a, b) => a.time.localeCompare(b.time));

  let body = `📋 MediRemind — Daily Medication Summary\r\n`;
  body += `Date: ${todayStr}\r\n\r\n`;
  body += `--------------------------------------------------\r\n`;
  body += `TODAY'S MEDICATION SCHEDULE\r\n`;
  body += `--------------------------------------------------\r\n\r\n`;

  if (items.length === 0) {
    body += `No medicines scheduled for today.\r\n\r\n`;
  } else {
    items.forEach((item) => {
      body += `[${formatTime12(item.time)}]  ${item.med.name}\r\n`;
      body += `           Dosage: ${item.med.dosage}\r\n`;
      body += `           Status: ${item.statusStr}\r\n`;
      if (item.med.notes) {
        body += `           Notes: ${item.med.notes}\r\n`;
      }
      if ((item.med.stockCount || 0) <= (item.med.lowStockThreshold || 5)) {
        body += `           ⚠️ Low Stock: ${item.med.stockCount ?? 0} remaining\r\n`;
      }
      body += `\r\n`;
    });
  }

  const totalCount = items.length;
  const takenCount = items.filter(i => i.taken).length;
  const missedCount = items.filter(i => i.past && !i.taken).length;
  const pendingCount = items.filter(i => !i.past && !i.taken).length;

  body += `--------------------------------------------------\r\n`;
  body += `SUMMARY & INVENTORY STATUS\r\n`;
  body += `--------------------------------------------------\r\n`;
  body += `Total Scheduled Doses: ${totalCount}\r\n`;
  body += `Taken: ${takenCount}\r\n`;
  body += `Missed: ${missedCount}\r\n`;
  body += `Pending: ${pendingCount}\r\n\r\n`;

  const lowStockMeds = state.medicines.filter(m => (m.stockCount || 0) <= (m.lowStockThreshold || 5));
  if (lowStockMeds.length > 0) {
    body += `⚠️ LOW STOCK ALERTS:\r\n`;
    lowStockMeds.forEach(m => {
      body += `- ${m.name}: ${m.stockCount ?? 0} left in stock (Threshold: ${m.lowStockThreshold || 5})\r\n`;
    });
    body += `\r\n`;
  }

  body += `--------------------------------------------------\r\n`;
  body += `Sent via MediRemind — Your Medicine Companion\r\n`;

  return {
    subject: `Daily Medicine Summary - ${todayStr}`,
    body
  };
}

  container.appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

// ---------- Schedule ----------
function renderSchedule() {
  const items = state.medicines.flatMap(med =>
    med.times.map(time => ({
      id: `${med.id}-${time}`,
      medId: med.id,
      medicineName: med.name,
      dosage: med.dosage,
      time,
      taken: !!med.takenTimes[time],
    }))
  );
  const sorted = [...items].sort((a, b) => a.time.localeCompare(b.time));
  const now = new Date();
  const isPast = (time) => {
    const [h, m] = time.split(':').map(Number);
    const scheduled = new Date(); scheduled.setHours(h, m, 0, 0);
    return now > scheduled;
  };

  const timeline = sorted.map((item, index) => {
    const isItemPast = isPast(item.time);
    const isNext = !isItemPast && sorted.slice(0, index).every(i => isPast(i.time));
    const isMissed = isItemPast && !item.taken;
    const isTaken = !!item.taken;
    const stateClass = isTaken ? 'is-taken' : (isMissed ? 'is-missed' : '');
    const badgeClass = isNext ? 'badge-default' : (isTaken ? '' : '');
    return `
    <div class="timeline-item ${stateClass}" data-testid="schedule-item-${item.id}">
      <div class="timeline-marker">
        <span class="badge ${badgeClass}" style="width:5rem;justify-content:center;" data-testid="badge-time-${item.id}">${icon('clock', isNext ? 'icon-xs' : 'icon-xs icon-clock')} ${formatTime12(item.time)}</span>
        ${index < sorted.length - 1 ? '<div class="timeline-line"></div>' : ''}
      </div>
      <div class="timeline-content">
        <div class="flex items-center gap-2 mb-1">
          <span class="icon-sm text-primary" style="display:inline-flex">${ICONS.pill}</span>
          <h3 class="font-medium" data-testid="text-medicine-${item.id}">${escapeHtml(item.medicineName)}</h3>
          ${isTaken ? `<span class="badge badge-default" data-testid="badge-taken-${item.id}">${icon('check','icon-xs')} Taken</span>` : ''}
          ${isMissed ? `<span class="badge badge-missed" data-testid="badge-missed-${item.id}">${icon('alertTriangle','icon-xs')} Missed</span>` : ''}
        </div>
        <p class="text-sm text-muted mb-2" data-testid="text-dosage-${item.id}">${escapeHtml(item.dosage)}</p>
        <button class="btn ${item.taken ? 'btn-primary' : 'btn-outline'} btn-sm" data-action="mark-taken" data-id="${item.medId}" data-time="${item.time}" data-testid="button-mark-taken-schedule-${item.id}">
          ${item.taken ? icon('check','icon-sm') + ' Taken' : 'Mark Taken'}
        </button>
      </div>
    </div>`;
  }).join('');

  const lastSentLabel = state.lastEmailSentAt
    ? new Date(state.lastEmailSentAt).toLocaleString([], { hour: 'numeric', minute: '2-digit', hour12: true })
    : 'Not sent yet';

  return `
  <div class="page">
    <header class="app-header">
      <div class="max-w-4xl px-4 py-4 header-row">
        <div>
          <h1 class="title-xl" data-testid="text-schedule-title">Schedule</h1>
          <p class="subtitle" data-testid="text-schedule-subtitle">Today's medication timeline</p>
        </div>
        ${themeToggleHTML('schedule')}
      </div>
    </header>
    <main class="max-w-4xl px-4 py-6 space-y-6">
      <div class="card card-p6" data-testid="card-today-schedule">
        <h2 class="text-2xl font-semibold mb-6">Today's Schedule</h2>
        ${sorted.length === 0 ? `
        <div class="empty-state" data-testid="empty-state-schedule">
          <div class="empty-icon-wrap">${icon('pillBottle', 'empty-icon')}</div>
          <h2 class="empty-title" data-testid="text-empty-title-schedule">No medicines added yet</h2>
          <p class="empty-desc" data-testid="text-empty-description-schedule">Add a medicine to see today's schedule here.</p>
          <button class="btn btn-primary btn-lg" id="btn-add-medicine-schedule" data-testid="button-add-medicine-schedule">${icon('plus')} Add Your First Medicine</button>
        </div>` : `<div class="space-y-4">${timeline}</div>`}
      </div>
      <div class="card card-p6" data-testid="card-email-summary">
        <div class="flex items-start justify-between mb-4">
          <div class="flex items-center gap-3">
            <div style="padding:.5rem;background:hsl(var(--primary)/.1);border-radius:var(--radius-md);">
              <span class="icon-sm text-primary" style="display:inline-flex">${ICONS.mail}</span>
            </div>
            <div>
              <h3 class="font-semibold text-lg" data-testid="text-title">Daily Email Summary</h3>
              <p class="text-sm text-muted" data-testid="text-scheduled-time">Scheduled daily at ${formatTime12('09:00')}</p>
            </div>
          </div>
        </div>
        <div class="space-y-4">
          <div class="flex items-center gap-2 text-sm">
            ${icon('clock','icon-sm icon-clock')}<span class="text-muted">Last sent:</span>
            <span class="badge" data-testid="badge-last-sent">${lastSentLabel}</span>
          </div>
          <div class="flex items-center gap-2 text-sm">
            <span class="text-muted">Medicines included:</span>
            <span class="badge badge-default" data-testid="badge-medicine-count">${state.medicines.length}</span>
          </div>
          <button class="btn btn-outline btn-full mt-2" id="btn-resend-email" data-testid="button-resend" ${state.medicines.length === 0 ? 'disabled' : ''}>${icon('send','icon-sm')} Send Now</button>
        </div>
      </div>
    </main>
  </div>`;
}

function escapeHtml(str) {
  if (str === undefined || str === null) return '';
  return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

function rescheduleReminders() {
  NotificationManager.cancelAll();
  state.medicines.forEach(med => {
    med.times.forEach(time => {
      NotificationManager.scheduleReminder({
        id: med.id, medicineName: med.name, dosage: med.dosage, time,
        enableNotifications: med.enableNotifications ?? true,
        enableVoiceReminder: med.enableVoiceReminder ?? true,
      });
    });
  });
}

// ---------- Event handling ----------
function attachHandlers() {
  document.querySelectorAll('[id^="theme-toggle-"]').forEach(b => b.addEventListener('click', toggleTheme));

  document.querySelectorAll('[data-action="set-tab"]').forEach(b => b.addEventListener('click', () => {
    state.activeTab = b.dataset.tab;
    console.log('Tab changed to:', state.activeTab);
    render();
  }));

  const addHeaderBtn = document.getElementById('btn-add-medicine-header');
  if (addHeaderBtn) addHeaderBtn.addEventListener('click', () => { state.editingMedicineId = null; state.addMedicineTimes = []; state.showAddMedicineDialog = true; render(); });
  const addFirstBtn = document.getElementById('btn-add-first-medicine');
  if (addFirstBtn) addFirstBtn.addEventListener('click', () => { state.editingMedicineId = null; state.addMedicineTimes = []; state.showAddMedicineDialog = true; render(); });
  const addFirstBtnSchedule = document.getElementById('btn-add-medicine-schedule');
  if (addFirstBtnSchedule) addFirstBtnSchedule.addEventListener('click', () => { state.editingMedicineId = null; state.addMedicineTimes = []; state.showAddMedicineDialog = true; render(); });

  document.querySelectorAll('[data-action="edit-med"]').forEach(b => b.addEventListener('click', () => {
    const med = state.medicines.find(m => m.id === b.dataset.id);
    if (!med) return;
    state.editingMedicineId = med.id;
    state.addMedicineTimes = [...med.times];
    state.showAddMedicineDialog = true;
    console.log('Editing medicine:', med.id);
    render();
  }));
  document.querySelectorAll('[data-action="delete-med"]').forEach(b => b.addEventListener('click', () => {
    state.medicines = state.medicines.filter(m => m.id !== b.dataset.id);
    console.log('Medicine deleted:', b.dataset.id);
    render();
  }));
  document.querySelectorAll('[data-action="mark-taken"]').forEach(b => b.addEventListener('click', () => {
    const med = state.medicines.find(m => m.id === b.dataset.id);
    if (!med) return;
    const time = b.dataset.time;
    const qty = med.quantityPerDose || 1;
    const wasTaken = !!med.takenTimes[time];
    if (!wasTaken) {
      if ((med.stockCount || 0) < qty) {
        showToast('Not enough stock', `${med.name} doesn't have enough stock left for this dose`, 'destructive');
        return;
      }
      med.stockCount = Math.max(0, (med.stockCount || 0) - qty);
      med.takenTimes[time] = true;
    } else {
      med.stockCount = (med.stockCount || 0) + qty;
      med.takenTimes[time] = false;
    }
    console.log(`Marked ${med.name} at ${time} as ${med.takenTimes[time] ? 'taken' : 'not taken'} — stock now ${med.stockCount}`);
    render();
  }));

  const timeInput = document.getElementById('time-input');
  const addTimeBtn = document.getElementById('btn-add-time');
  function attachTimeChipRemoveHandlers() {
    document.querySelectorAll('[data-action="remove-time"]').forEach(b => b.addEventListener('click', () => {
      state.addMedicineTimes = state.addMedicineTimes.filter(t => t !== b.dataset.time);
      renderTimeChips();
    }));
  }
  function renderTimeChips() {
    const chipsEl = document.getElementById('time-chips');
    if (chipsEl) {
      chipsEl.innerHTML = state.addMedicineTimes.map(t =>
        `<span class="badge" data-testid="badge-time-${t}">${formatTime12(t)}<button type="button" class="chip-remove" data-action="remove-time" data-time="${t}" data-testid="button-remove-time-${t}">${icon('x','icon-xs')}</button></span>`
      ).join('');
      attachTimeChipRemoveHandlers();
    }
  }
  if (addTimeBtn) addTimeBtn.addEventListener('click', () => {
    const val = timeInput.value;
    if (val && !state.addMedicineTimes.includes(val)) {
      state.addMedicineTimes = [...state.addMedicineTimes, val].sort();
      renderTimeChips();
      timeInput.value = '';
      const errorEl = document.getElementById('times-error');
      if (errorEl) errorEl.classList.add('hidden');
    }
  });
  attachTimeChipRemoveHandlers();

  const addMedForm = document.getElementById('add-medicine-form');
  if (addMedForm) addMedForm.addEventListener('submit', (e) => {
    e.preventDefault();
    try {
      const errorEl = document.getElementById('times-error');
      if (state.addMedicineTimes.length === 0) {
        if (errorEl) errorEl.classList.remove('hidden');
        return;
      }
      const fd = new FormData(addMedForm);
      const data = {
        name: fd.get('name'), dosage: fd.get('dosage'), frequency: fd.get('frequency'),
        notes: fd.get('notes') || undefined,
        stockCount: Number(fd.get('stockCount')) || 0,
        lowStockThreshold: Number(fd.get('lowStockThreshold')) || 5,
        quantityPerDose: Math.max(1, Number(fd.get('quantityPerDose')) || 1),
      };
      if (state.editingMedicineId) {
        const idx = state.medicines.findIndex(m => m.id === state.editingMedicineId);
        if (idx !== -1) {
          state.medicines[idx] = {
            ...state.medicines[idx],
            name: data.name, dosage: data.dosage, times: state.addMedicineTimes,
            frequency: data.frequency, stockCount: data.stockCount,
            lowStockThreshold: data.lowStockThreshold, notes: data.notes,
            quantityPerDose: data.quantityPerDose,
          };
          console.log('Medicine updated:', state.medicines[idx]);
        }
        state.editingMedicineId = null;
      } else {
        const newMedicine = {
          id: Date.now().toString(), name: data.name, dosage: data.dosage,
          times: state.addMedicineTimes, frequency: data.frequency,
          stockCount: data.stockCount, lowStockThreshold: data.lowStockThreshold,
          quantityPerDose: data.quantityPerDose,
          enableNotifications: true, enableVoiceReminder: true,
          notes: data.notes, takenTimes: {},
        };
        state.medicines = [...state.medicines, newMedicine];
        if (newMedicine.stockCount <= newMedicine.lowStockThreshold) console.log('Low stock alert for:', newMedicine.name);
        console.log('Medicine added:', newMedicine);
      }
      state.showAddMedicineDialog = false;
      state.activeTab = addMedForm.dataset.inDialog === 'true' ? state.activeTab : 'home';
      render();
    } catch (err) {
      console.error('Failed to save medicine:', err);
      showToast('Something went wrong saving this medicine', String(err && err.message || err), 'destructive');
    }
  });
  document.querySelectorAll('[data-action="cancel-add-medicine"]').forEach(b => b.addEventListener('click', () => {
    state.showAddMedicineDialog = false;
    state.editingMedicineId = null;
    if (state.activeTab === 'add') state.activeTab = 'home';
    render();
  }));
  const overlay1 = document.getElementById('add-medicine-overlay');
  if (overlay1) overlay1.addEventListener('click', (e) => { if (e.target === overlay1) { state.showAddMedicineDialog = false; state.editingMedicineId = null; render(); } });

  // Family
  const addFamilyBtn = document.getElementById('btn-add-family-member');
  if (addFamilyBtn) addFamilyBtn.addEventListener('click', () => { state.showAddFamilyDialog = true; render(); });
  document.querySelectorAll('[data-action="delete-family"]').forEach(b => b.addEventListener('click', () => {
    state.familyMembers = state.familyMembers.filter(m => m.id !== b.dataset.id);
    console.log('Family member deleted:', b.dataset.id);
    render();
  }));
  document.querySelectorAll('[data-switch]').forEach(sw => {
    const toggle = () => {
      sw.dataset.on = sw.dataset.on === 'true' ? 'false' : 'true';
      sw.setAttribute('aria-checked', sw.dataset.on);
    };
    sw.addEventListener('click', toggle);
    sw.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggle(); }
    });
  });
  const addFamilyForm = document.getElementById('add-family-form');
  if (addFamilyForm) addFamilyForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = new FormData(addFamilyForm);
    const notifyMissedSwitch = addFamilyForm.querySelector('[data-switch="notifyOnMissed"]');
    const notifyTakenSwitch = addFamilyForm.querySelector('[data-switch="notifyOnTaken"]');
    const newMember = {
      id: Date.now().toString(),
      name: fd.get('name'), email: fd.get('email'),
      phone: fd.get('phone') || '', relation: fd.get('relation') || '',
      notifyOnMissed: notifyMissedSwitch.dataset.on === 'true',
      notifyOnTaken: notifyTakenSwitch.dataset.on === 'true',
    };
    state.familyMembers = [...state.familyMembers, newMember];
    state.showAddFamilyDialog = false;
    console.log('Family member added:', newMember);
    render();
  });
  document.querySelectorAll('[data-action="cancel-add-family"]').forEach(b => b.addEventListener('click', () => { state.showAddFamilyDialog = false; render(); }));
  const overlay2 = document.getElementById('add-family-overlay');
  if (overlay2) overlay2.addEventListener('click', (e) => { if (e.target === overlay2) { state.showAddFamilyDialog = false; render(); } });

  // Schedule
  const resendBtn = document.getElementById('btn-resend-email');
  if (resendBtn) resendBtn.addEventListener('click', () => {
    if (state.medicines.length === 0) return;
    console.log('Resending email summary');
    const to = state.familyMembers[0]?.email || '';
    const { subject, body } = generateDailySummaryEmail();
    EmailManager.sendEmail({ to, subject, body });
    state.lastEmailSentAt = Date.now();
    showToast('Email summary resent', to ? `Opening mail app to ${to}` : 'Add a family member email first');
    render();
  });

  // Settings
  const enableNotifBtn = document.getElementById('btn-enable-notifications');
  if (enableNotifBtn) enableNotifBtn.addEventListener('click', async () => {
    const granted = await NotificationManager.requestPermission();
    if (granted) showToast('Notifications Enabled', 'You will now receive medicine reminders');
    else showToast('Permission Denied', 'Please enable notifications in your browser settings', 'destructive');
    render();
  });
  const testReminderBtn = document.getElementById('btn-test-reminder');
  if (testReminderBtn) testReminderBtn.addEventListener('click', () => {
    const sample = state.medicines[0] || { name: 'Aspirin', dosage: '100mg - 1 tablet' };
    const reminder = { id: 'test', medicineName: sample.name, dosage: sample.dosage, time: new Date().toTimeString().slice(0,5) };
    NotificationManager.showNotification(reminder);
    NotificationManager.speakReminder(reminder);
    showToast('Test reminder sent', 'Sound, notification, and voice alert triggered');
  });
  const testEmailBtn = document.getElementById('btn-test-email');
  if (testEmailBtn) testEmailBtn.addEventListener('click', () => {
    const to = document.querySelector('[data-testid="input-email-address"]')?.value || '';
    const dateStr = new Date().toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    const body = `🔔 MediRemind — Test Email Notification\r\nDate: ${dateStr}\r\n\r\nThis is a test email sent from your MediRemind app to verify your email configuration.\r\n\r\nSystem Status:\r\n- Email Notifications: Active\r\n- Total Medicines Configured: ${state.medicines.length}\r\n- Family Contacts Configured: ${state.familyMembers.length}\r\n\r\nEverything is set up correctly! You will receive structured daily summaries for your medicine schedule.\r\n\r\n--------------------------------------------------\r\nMediRemind — Your Medicine Companion`;
    EmailManager.sendEmail({ to, subject: 'MediRemind - Test Email Notification', body });
    showToast('Test email queued', to ? `Opening mail app to ${to}` : 'Enter an email address first');
  });
}

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (state.showAddMedicineDialog) { state.showAddMedicineDialog = false; state.editingMedicineId = null; render(); }
  else if (state.showAddFamilyDialog) { state.showAddFamilyDialog = false; render(); }
});

// ---------- Init ----------
initTheme();
loadAppData();
checkDailyReset();
NotificationManager.init();
NotificationManager.requestPermission().then(granted => console.log('Notification permission:', granted ? 'granted' : 'denied'));
render();

setInterval(() => {
  const before = state.lastUsageDate;
  checkDailyReset();
  if (state.lastUsageDate !== before) render();
}, 60000);
</script>
</body>
</html>
